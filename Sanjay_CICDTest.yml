trigger:
  branches:
    include:
    - master
variables:
- name: nodeVersion
  value: "22.x"
stages:
- stage: Build
  displayName: Build and publish artifacts
  jobs:
  - job: BuildApplication
    displayName: Build frontend and validate backend
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      displayName: Checkout source code
      inputs:
        repository: self
    - task: UseNode@1
      displayName: Install Node.js
      inputs:
        version: "$(nodeVersion)"
    - task: CmdLine@2
      displayName: Install frontend dependencies
      inputs:
        script: npm ci
    - task: CmdLine@2
      displayName: Build React frontend
      env:
        FIGMA_PUBLIC_URL: /poc/cfo-dashboard-cicd
      inputs:
        script: npm run build
    - task: CmdLine@2
      displayName: Install backend dependencies
      inputs:
        script: npm ci
        workingDirectory: "$(Build.SourcesDirectory)/backend"
    - task: CmdLine@2
      displayName: Validate backend syntax
      inputs:
        script: node --check server.js
        workingDirectory: "$(Build.SourcesDirectory)/backend"
    - task: PublishPipelineArtifact@1
      displayName: Publish frontend artifact
      inputs:
        targetPath: "$(Build.SourcesDirectory)/dist"
        artifact: "cfo-dashboard-frontend"
        publishLocation: "pipeline"
    - task: PublishPipelineArtifact@1
      displayName: Publish backend artifact
      inputs:
        targetPath: "$(Build.SourcesDirectory)/backend"
        artifact: "cfo-dashboard-backend"
        publishLocation: "pipeline"
- stage: VerifySelfHostedAgent
  displayName: Verify self-hosted agent safely
  dependsOn:
  - Build
  condition: succeeded()
  jobs:
  - job: VerifyAgent
    displayName: Read-only VM verification
    pool:
      name: "CICD Agent"
      demands:
      - Agent.Name -equals CICD_TEST
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      condition: false
      inputs:
        repository: none
    - task: CmdLine@2
      displayName: Verify isolated deployment resources
      inputs:
        script: |
          set -euo pipefail

          BASE_DIR="/home/largedealsdemoadmin/data/cfo-dashboard-cicd"
          EXPECTED_CONTAINER="cfo-dashboard-cicd-backend"

          echo "Agent user:"
          whoami

          echo "VM hostname:"
          hostname

          echo "Docker version:"
          docker --version

          echo "Deployment directory:"
          ls -ld "$BASE_DIR"

          if [ "$BASE_DIR" != "/home/largedealsdemoadmin/data/cfo-dashboard-cicd" ]; then
            echo "ERROR: Unexpected deployment directory"
            exit 1
          fi

          echo "Port and container safety check:"

          PORT_IN_USE="false"

          if ss -H -lnt 'sport = :5011' | grep -q .; then
            PORT_IN_USE="true"
          fi

          RUNNING_CONTAINER="$(docker ps \
            --filter "name=^/${EXPECTED_CONTAINER}$" \
            --format '{{.Names}}')"

          if [ "$PORT_IN_USE" = "true" ]; then
            if [ "$RUNNING_CONTAINER" = "$EXPECTED_CONTAINER" ]; then
              echo "Port 5011 is safely owned by $EXPECTED_CONTAINER"
            else
              echo "ERROR: Port 5011 is occupied by another process"
              exit 1
            fi
          else
            echo "Port 5011 is free"
          fi

          if docker container inspect "$EXPECTED_CONTAINER" >/dev/null 2>&1; then
            echo "Existing isolated practice container detected:"

            docker ps -a \
              --filter "name=^/${EXPECTED_CONTAINER}$" \
              --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          else
            echo "No existing isolated practice container detected"
          fi

          echo "Environment file check:"

          if [ ! -f "$BASE_DIR/config/backend.env" ]; then
            echo "ERROR: Environment file is missing"
            exit 1
          fi

          if [ ! -s "$BASE_DIR/config/backend.env" ]; then
            echo "ERROR: Environment file is empty"
            exit 1
          fi

          if ! grep -q '^BACKEND_PORT=5011$' "$BASE_DIR/config/backend.env"; then
            echo "ERROR: BACKEND_PORT=5011 is missing"
            exit 1
          fi

          echo "Environment file exists and backend port is correct."
          echo "Read-only verification completed successfully."
- stage: Deploy
  displayName: Deploy isolated CFO practice application
  dependsOn:
  - VerifySelfHostedAgent
  condition: succeeded()
  jobs:
  - job: DeployApplication
    displayName: Deploy frontend and backend safely
    pool:
      name: "CICD Agent"
      demands:
      - Agent.Name -equals CICD_TEST
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      condition: false
      inputs:
        repository: none
    - task: DownloadPipelineArtifact@2
      displayName: Download frontend artifact
      inputs:
        artifact: "cfo-dashboard-frontend"
        path: "$(Pipeline.Workspace)/frontend"
    - task: DownloadPipelineArtifact@2
      displayName: Download backend artifact
      inputs:
        artifact: "cfo-dashboard-backend"
        path: "$(Pipeline.Workspace)/backend"
    - task: CmdLine@2
      displayName: Copy artifacts to isolated directory
      inputs:
        script: |
          set -euo pipefail

          BASE_DIR="/home/largedealsdemoadmin/data/cfo-dashboard-cicd"
          FRONTEND_DIR="$BASE_DIR/dist"
          BACKEND_DIR="$BASE_DIR/backend"
          ENV_FILE="$BASE_DIR/config/backend.env"

          if [ "$BASE_DIR" != "/home/largedealsdemoadmin/data/cfo-dashboard-cicd" ]; then
            echo "ERROR: Unexpected deployment directory"
            exit 1
          fi

          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: Environment file is missing"
            exit 1
          fi

          if [ ! -s "$ENV_FILE" ]; then
            echo "ERROR: Environment file is empty"
            exit 1
          fi

          mkdir -p "$FRONTEND_DIR"
          mkdir -p "$BACKEND_DIR"

          find "$FRONTEND_DIR" \
            -mindepth 1 \
            -maxdepth 1 \
            -exec rm -rf -- {} +

          cp -a "$(Pipeline.Workspace)/frontend/." "$FRONTEND_DIR/"

          find "$BACKEND_DIR" \
            -mindepth 1 \
            -maxdepth 1 \
            -exec rm -rf -- {} +

          cp -a "$(Pipeline.Workspace)/backend/." "$BACKEND_DIR/"

          echo "Application artifacts copied successfully."

          echo "Frontend files:"
          find "$FRONTEND_DIR" -maxdepth 1 -type f -printf '%f\n'

          echo "Backend files:"
          find "$BACKEND_DIR" -maxdepth 1 -type f -printf '%f\n'
    - task: CmdLine@2
      displayName: Build and start isolated backend container
      inputs:
        script: |
          set -euo pipefail

          BASE_DIR="/home/largedealsdemoadmin/data/cfo-dashboard-cicd"
          BACKEND_DIR="$BASE_DIR/backend"
          ENV_FILE="$BASE_DIR/config/backend.env"
          CONTAINER_NAME="cfo-dashboard-cicd-backend"
          IMAGE_NAME="cfo-dashboard-cicd-backend:$(Build.BuildId)"

          if [ "$BASE_DIR" != "/home/largedealsdemoadmin/data/cfo-dashboard-cicd" ]; then
            echo "ERROR: Unexpected deployment directory"
            exit 1
          fi

          if [ ! -f "$BACKEND_DIR/Dockerfile" ]; then
            echo "ERROR: Backend Dockerfile is missing"
            exit 1
          fi

          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: Environment file is missing"
            exit 1
          fi

          if ss -H -lnt 'sport = :5011' | grep -q .; then
            EXISTING_PORT_OWNER="$(docker ps \
              --filter "name=^/${CONTAINER_NAME}$" \
              --format '{{.Names}}')"

            if [ "$EXISTING_PORT_OWNER" != "$CONTAINER_NAME" ]; then
              echo "ERROR: Port 5011 is occupied by another process"
              exit 1
            fi

            echo "Port 5011 belongs to the expected isolated container."
          else
            echo "Port 5011 is free."
          fi

          echo "Building isolated backend image: $IMAGE_NAME"

          docker build \
            --tag "$IMAGE_NAME" \
            "$BACKEND_DIR"

          if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            echo "Replacing only the existing isolated practice container."

            docker stop "$CONTAINER_NAME"
            docker rm "$CONTAINER_NAME"
          fi

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            -p 127.0.0.1:5011:5011 \
            "$IMAGE_NAME"

          sleep 5

          if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]; then
            echo "ERROR: Isolated backend container failed to start"
            docker logs --tail 100 "$CONTAINER_NAME"
            exit 1
          fi

          echo "Isolated backend container is running."

          docker ps \
            --filter "name=^/${CONTAINER_NAME}$" \
            --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

